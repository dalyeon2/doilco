<!doctype html>
<html lang="ko">

<head>
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" href="../../assets/icons/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="../../assets/css/pages/history.css">
    <title>연혁 | DOIL CORPORATION</title>
</head>

<body>
    <div id="header-container"></div>

    <!-- s: subtop -->
    <section class="subtop">
        <div class="container">
            <div class="head">
                <div class="crumb" aria-label="breadcrumb">
                    <span class="home" aria-hidden="true"></span>
                    <span class="caption1">회사소개</span>
                    <strong class="caption1">연혁</strong>
                </div>
                <h1 class="title point1">연혁</h1>
            </div>

            <div class="visual">
                <img class="image" src="../../assets/img/company/bg-history.jpg" alt="">
            </div>
        </div>
    </section>
    
    <!-- s: section 1 -->
    <section class="cont1">
        <div class="container">
            <h2 class="title headline1" datachars>Since 1990,
                끊임없는 도전과 혁신의 발자취</h2>
        </div>
    </section>

    <!-- s: section 2 -->
    <section class="cont2">
        <div class="container reveal-group">
            <div class="item right reveal-item">
                <div class="date point2">1990.08.02.</div>
                <div class="box">
                    <p class="text body4">개인기업 우원물산 설립</p>
                </div>
                <div class="dot" aria-hidden="true"></div>
            </div>

            <div class="item left reveal-item">
                <div class="date point2">1996.07.19.</div>
                <div class="box">
                    <p class="text body4">법인기업 도일상사주식회사 설립</p>
                </div>
                <div class="dot" aria-hidden="true"></div>
            </div>
        </div>
    </section>

    <div id="footer-container"></div>
    <button class="scroll-top-btn" id="scrollTopBtn" aria-label="Scroll to Top"></button>

    <!-- jquery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- gsap -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <!-- ScrollTo Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>

    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/pages/history.js"></script>
